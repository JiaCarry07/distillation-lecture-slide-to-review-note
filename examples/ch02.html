<h1 class="chap"><span class="cn">CHAPTER 2</span>习题解析（自编示例）</h1>
<p>下面的题目为演示题解版式而编写。</p>
<div class="q">
  <div class="qh"><span class="qn">2-1</span><span class="qt">电阻电流</span><span class="qa">2 A</span></div>
  <div class="qb">
    <p>已知电阻两端电压为 $6\ \mathrm{V}$、电阻为 $3\ \Omega$，求电流。</p>
    <ol class="step"><li>使用欧姆定律 $I=U/R$。</li><li>代入数值并检查单位。</li></ol>
    <div class="fx">$$I=\frac{6\ \mathrm{V}}{3\ \Omega}=2\ \mathrm{A}$$</div>
    <div class="callout tip">电压除以电阻的单位是安培。</div>
  </div>
</div>
